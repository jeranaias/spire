server {
    listen 8080;
    server_name _;

    # SPA static assets — fall through to index.html so HashRouter routes work.
    root /usr/share/nginx/html;
    index index.html;

    # Long cache for hashed asset files; bypass for the entry HTML.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Proxy /api/* to the backend container. Service name resolves via the
    # docker-compose network. SSE / streams are kept alive at the proxy layer.
    location /api/ {
        proxy_pass http://backend:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
