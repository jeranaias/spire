    <!-- Static hero — paints instantly on cold load (hotel WiFi, judge first
         click). React removes #spire-static-hero on hydration. CAPCO U-banner
         + wordmark + loading status, zero JS dependency, no cross-origin
         requests. Fonts self-hosted via @fontsource imports in main.tsx. -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0c13; color: #e5e7eb; }
      body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      #spire-static-hero {
        position: fixed; inset: 0; z-index: 50;
        display: flex; flex-direction: column;
        background: #0a0c13;
      }
      #spire-static-hero .capco {
        height: 28px; flex-shrink: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 16px;
        background: #007A33; color: #FFFFFF;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px; font-weight: 600;
        letter-spacing: 0.18em; text-transform: uppercase;
      }
      #spire-static-hero .capco .fpcon {
        border: 1px solid rgba(255,255,255,0.5);
        background: rgba(0,0,0,0.25);
        padding: 1px 10px; border-radius: 2px;
        font-size: 10px; letter-spacing: 0.18em;
      }
      #spire-static-hero .body {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 22px; padding: 24px;
      }
      #spire-static-hero .wordmark {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 28px; font-weight: 600;
        letter-spacing: 0.32em; color: #e5e7eb;
      }
      #spire-static-hero .tagline {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
        color: #9ca3af;
      }
      #spire-static-hero .loading {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
        color: #6b7280;
        display: flex; align-items: center; gap: 10px;
      }
      #spire-static-hero .loading .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: #3b82f6;
        animation: spire-pulse 1.2s ease-in-out infinite;
      }
      @keyframes spire-pulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="spire-static-hero">
      <div class="capco">
        <span>UNCLASSIFIED // DEMO DATA // NOT FOR OPERATIONAL USE</span>
        <span class="fpcon">FPCON BRAVO</span>
      </div>
      <div class="body">
        <div class="wordmark">SPIRE</div>
        <div class="tagline">Contested Logistics Operating System</div>
        <div class="loading"><span class="dot"></span><span>Loading</span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // /pitch and /demo URL-bar safety net. The app is a HashRouter SPA, so
      // the canonical URLs are /#/pitch and /#/demo. If a presenter (or a
      // judge with a typed link) hits a bare /pitch or /demo path WITHOUT a
      // hash, the SPA index loads and the router falls through to the
      // Decision Bridge — looking like a routing bug under stage lights.
      // Detect known presenter routes and rewrite to the hash form before
      // React boots so the router resolves correctly on first paint.
      (function () {
        try {
          var p = window.location.pathname;
          var h = window.location.hash;
          // Strip a trailing slash so /pitch/ and /demo/ also redirect.
          var normalized = p.length > 1 && p.charAt(p.length - 1) === "/"
            ? p.slice(0, -1)
            : p;
          var KNOWN = ["/pitch", "/demo"];
          if (!h && KNOWN.indexOf(normalized) !== -1) {
            window.location.replace("/#" + normalized + window.location.search);
          }
        } catch (_) {
          /* never block app boot on a redirect failure */
        }
      })();
    </script>
    <script type="module" crossorigin src="/src/main.tsx"></script>
  </body>
</html>
