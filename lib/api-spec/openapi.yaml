    DistroAuditEntry:
      type: object
      properties:
        bucket:
          type: string
          enum: [to, cc, bcc]
          description: Which distribution-list bucket the malformed value lives in
        value:
          type: string
          description: The literal stored value that failed the email shape regex
      required: [bucket, value]

    DistroAuditUnit:
      type: object
      properties:
        unitId:
          type: string
        unitName:
          type: string
        echelon:
          $ref: "#/components/schemas/Echelon"
        callsign:
          type: string
          nullable: true
        invalidEntries:
          type: array
          items:
            $ref: "#/components/schemas/DistroAuditEntry"
        invalidCount:
          type: integer
          minimum: 1
          description: Total number of malformed entries across all buckets for this unit
      required: [unitId, unitName, echelon, callsign, invalidEntries, invalidCount]

    DistroAudit:
      type: object
      properties:
        scannedUnitCount:
          type: integer
          minimum: 0
          description: Total number of units inspected
        flaggedUnitCount:
          type: integer
          minimum: 0
        invalidEntryCount:
          type: integer
          minimum: 0
          description: Total number of malformed entries across all flagged units
        units:
          type: array
          items:
            $ref: "#/components/schemas/DistroAuditUnit"
        lastRun:
          allOf:
            - $ref: "#/components/schemas/CommsHygieneRun"
          nullable: true
          description: >-
            The most recent comms-hygiene digest run, regardless of outcome.
            `null` until the scheduler has run at least once. Use `outcome`
            to distinguish a successful send from a skipped/failed attempt.
        lastSuccessfulSend:
          allOf:
            - $ref: "#/components/schemas/CommsHygieneRun"
          nullable: true
          description: >-
            The most recent run whose outcome was `sent`, or `null` if no
            digest has ever been delivered. Surfaced separately so planners
            can see when the last digest actually went out even after a
            recent failure.
      required:
        - scannedUnitCount
        - flaggedUnitCount
        - invalidEntryCount
        - units
        - lastRun
        - lastSuccessfulSend

    CommsHygieneOutcome:
      type: string
      enum:
        - sent
        - skipped_no_flags
        - skipped_no_recipients
        - skipped_no_smtp
        - failed
      description: >-
        `sent` — digest was delivered to SMTP.
        `skipped_no_flags` — audit found nothing to report so no email was sent.
        `skipped_no_recipients` — flagged units exist but `COMMS_HYGIENE_TO` is empty.
        `skipped_no_smtp` — SMTP not configured; digest preview was logged instead.
        `failed` — SMTP rejected the send (see `errorMessage`).

    CommsHygieneRun:
      type: object
      properties:
        id:
          type: string
        ranAt:
          type: string
          format: date-time
        auditedCount:
          type: integer
          minimum: 0
          description: Number of units scanned during this run
        flaggedCount:
          type: integer
          minimum: 0
        invalidCount:
          type: integer
          minimum: 0
        recipients:
          type: array
          items:
            type: string
          description: Recipient list the digest was (or would have been) sent to
        cc:
          type: array
          items:
            type: string
        outcome:
          $ref: "#/components/schemas/CommsHygieneOutcome"
        errorMessage:
          type: string
          nullable: true
          description: SMTP / runtime error message when `outcome` is `failed`
      required:
        - id
        - ranAt
        - auditedCount
        - flaggedCount
        - invalidCount
        - recipients
        - cc
        - outcome
        - errorMessage

    CommsHygieneStats:
      type: object
      description: >-
        Run-history stats for the dashboard footnote. Lets planners see how
        many digest runs are stored and when older ones will fall off under
        the active retention policy.
      properties:
        totalRuns:
          type: integer
          minimum: 0
          description: Total number of `comms_hygiene_runs` rows currently stored.
        oldestRanAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Timestamp of the oldest stored run, or `null` when the table
            is empty.
        retentionDays:
          type: integer
          minimum: 0
          description: >-
            Effective retention horizon in days. Equal to
            `retentionDaysOverride` when an in-app override is active,
            otherwise `retentionDaysDefault`. 0 means retention is disabled.
        retentionDaysOverride:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Dashboard-set retention override in days, or `null` when no
            override is active and the env-var default applies. Surfaced
            so the footnote can flag when an admin has temporarily widened
            (or disabled) retention.
        retentionDaysDefault:
          type: integer
          minimum: 0
          description: >-
            Env-var (`COMMS_HYGIENE_RETENTION_DAYS`, default 180) used
            when no override is active. Returned alongside the effective
            value so the dashboard can label the source.
        oldestExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the oldest stored run is expected to age out of the table
            (oldest `ranAt` plus `retentionDays`). `null` when the table is
            empty or retention is disabled.
        nearExpiryWindowDays:
          type: integer
          minimum: 0
          description: >-
            Configured "expires soon" window in days
            (`COMMS_HYGIENE_NEAR_EXPIRY_WINDOW_DAYS`, default 7). Rows whose
            projected expiry falls within this window of "now" are considered
            near-expiry. Always 0 when retention is disabled.
        nearExpiryCount:
          type: integer
          minimum: 0
          description: >-
            Number of stored runs whose projected expiry (`ranAt` plus
            `retentionDays`) is within `nearExpiryWindowDays` of the current
            time, including any rows that have already passed their expiry
            but have not yet been pruned. Always 0 when retention is
            disabled.
      required:
        - totalRuns
        - oldestRanAt
        - retentionDays
        - retentionDaysOverride
        - retentionDaysDefault
        - oldestExpiresAt
        - nearExpiryWindowDays
        - nearExpiryCount

    CommsHygieneSettings:
      type: object
      description: >-
        Effective comms-hygiene retention settings. The dashboard reads
        this to render the in-app retention control (current value, the
        env-var fallback, and the last time the override was changed).
      properties:
        retentionDays:
          type: integer
          minimum: 0
          description: >-
            Effective retention horizon in days that the prune sweep and
            stats endpoint use right now. 0 means retention is disabled.
        retentionDaysOverride:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            Dashboard-set override; `null` when no override is active and
            the env-var default applies.
        retentionDaysDefault:
          type: integer
          minimum: 0
          description: >-
            Env-var (`COMMS_HYGIENE_RETENTION_DAYS`) value used when no
            override is set. Lets the UI label the fallback alongside any
            active override.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Last time the settings row was written, or `null` if the
            override has never been touched.
      required:
        - retentionDays
        - retentionDaysOverride
        - retentionDaysDefault
        - updatedAt

    CommsHygieneSettingsUpdate:
      type: object
      description: >-
        Payload for `PUT /dashboard/comms-hygiene-settings`. Set
        `retentionDaysOverride` to a non-negative integer (0 disables
        pruning entirely) to install an override, or `null` to clear it
        and fall back to the env-var default.
      properties:
        retentionDaysOverride:
          type: integer
          minimum: 0
          maximum: 3650
          nullable: true
          description: >-
            New override in days, or `null` to clear the override. Capped
            at 3650 days (~10 years) to keep the prune cutoff math sane.
      required:
        - retentionDaysOverride

    DistroAuditDigestResult:
      type: object
      description: Outcome of an on-demand `runCommsHygieneOnce` invocation.
      properties:
        audited:
          type: integer
          minimum: 0
          description: Number of units inspected during the run
        flagged:
          type: integer
          minimum: 0
          description: Number of units with at least one malformed entry
        invalid:
          type: integer
          minimum: 0
          description: Total number of malformed entries across all flagged units
        emailSent:
          type: boolean
          description: True when an email was actually dispatched to recipients
        reason:
          type: string
          enum:
            - no_flagged_entries
            - no_recipients
            - smtp_not_configured
          description: >-
            When `emailSent` is false, why the email was not sent.
            `no_flagged_entries` means the digest was suppressed because every
            distro list is clean. `no_recipients` and `smtp_not_configured`
            indicate a server-side configuration gap.
      required: [audited, flagged, invalid, emailSent]

    DistroAuditDigestPreview:
      type: object
      description: >-
        Rendered digest payload (subject / text / html) that the live send
        path would dispatch, returned without invoking SMTP.
      properties:
        audited:
          type: integer
          minimum: 0
          description: Number of units inspected during the preview build
        flagged:
          type: integer
          minimum: 0
          description: Number of units with at least one malformed entry
        invalid:
          type: integer
          minimum: 0
          description: Total number of malformed entries across all flagged units
        suppressed:
          type: boolean
          description: >-
            True when no entries were flagged. The live send path suppresses
            the email in this case; the preview still returns the rendered
            payload so callers can confirm what would have been produced.
        subject:
          type: string
          description: Email subject line that the live send would use
        text:
          type: string
          description: Plain-text email body that the live send would use
        html:
          type: string
          description: HTML email body that the live send would use
      required: [audited, flagged, invalid, suppressed, subject, text, html]

