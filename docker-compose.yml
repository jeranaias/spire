# MARLOG — docker-compose for local stand-up.
#
# This file lives at the root of the marlog/ module.  When MARLOG is
# bundled into the SPIRE repo, copy the `marlog-api`, `marlog-web`, and
# `marlog-db` services (and the `marlog-net` network) into SPIRE's
# top-level docker-compose.yml so they share the SPIRE backend network.
#
# Standalone usage:
#   docker compose up --build
#   # then browse to http://localhost:8080
#
# One-shot operations:
#   docker compose run --rm marlog-api node ./dist/index.mjs   # start API
#   docker compose exec marlog-db psql -U marlog -d marlog     # db shell
#
# DB schema/seed (run once after first start, against marlog-db):
#   pnpm --filter @workspace/db run push
#   pnpm --filter @workspace/scripts run seed

name: marlog

services:
  marlog-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marlog
      POSTGRES_PASSWORD: marlog
      POSTGRES_DB: marlog
    volumes:
      - marlog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marlog -d marlog"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - marlog-net

  marlog-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: marlog-api
    image: marlog-api:local
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://marlog:marlog@marlog-db:5432/marlog
    depends_on:
      marlog-db:
        condition: service_healthy
    networks:
      - marlog-net
    expose:
      - "3000"

  marlog-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: marlog-web
    image: marlog-web:local
    restart: unless-stopped
    depends_on:
      - marlog-api
    networks:
      - marlog-net
    ports:
      - "8080:80"

volumes:
  marlog-db-data:

networks:
  marlog-net:
    # In SPIRE: replace with `external: true` and the SPIRE backend network
    # name so MARLOG can reach SPIRE's shared services.
    driver: bridge
