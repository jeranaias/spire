openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Marine Corps logistics calculator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: units
    description: Units (squad, platoon, company, etc.)
  - name: missions
    description: Missions / operations
  - name: supply
    description: Supply on-hand and consumption
  - name: resupply
    description: Resupply events and projections
  - name: dashboard
    description: Aggregated dashboard data
  - name: catalog
    description: Reference catalog (supply items, consumption rates)
  - name: sync
    description: External system sync
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /units:
    get:
      operationId: listUnits
      tags: [units]
      summary: List all units
      responses:
        "200":
          description: List of units
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Unit"
    post:
      operationId: createUnit
      tags: [units]
      summary: Create a unit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"

  /units/{unitId}:
    get:
      operationId: getUnit
      tags: [units]
      summary: Get unit detail
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Unit detail with supply summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitDetail"
    patch:
      operationId: updateUnit
      tags: [units]
      summary: Update a unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitInput"
      responses:
        "200":
          description: Updated unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
    delete:
      operationId: deleteUnit
      tags: [units]
      summary: Delete a unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /units/{unitId}/supply/{itemId}:
    delete:
      operationId: deleteUnitSupply
      tags: [supply]
      summary: Remove a supply item from a unit and cancel future resupply events for it
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Unit or supply entry not found

  /units/{unitId}/supply/copy-from:
    post:
      operationId: copySupplyFromUnit
      tags: [supply]
      summary: Copy supply items from another unit to this unit (new items only, added at 0 on-hand)
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyFromUnitInput"
      responses:
        "200":
          description: Items added from source unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyFromUnitResult"
        "404":
          description: Unit or source unit not found

  /units/{unitId}/supply:
    get:
      operationId: getUnitSupply
      tags: [supply]
      summary: Get on-hand supply for a unit, by class
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Supply entries with computed days-of-supply
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyEntry"
    post:
      operationId: upsertUnitSupply
      tags: [supply]
      summary: Set or update an on-hand quantity for a supply item
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplyEntryInput"
      responses:
        "200":
          description: Upserted entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyEntry"

  /units/{unitId}/calculate:
    post:
      operationId: calculateRequirements
      tags: [supply]
      summary: Calculate required supplies for a planning window
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
      responses:
        "200":
          description: Required quantities by class and item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"

  /units/{unitId}/resupply:
    get:
      operationId: listUnitResupply
      tags: [resupply]
      summary: List resupply events (planned and projected) for a unit
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resupply events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResupplyEvent"
    post:
      operationId: createResupplyEvent
      tags: [resupply]
      summary: Create a planned resupply event
      parameters:
        - name: unitId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResupplyEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResupplyEvent"

  /resupply/{eventId}:
    patch:
      operationId: updateResupplyEvent
      tags: [resupply]
      summary: Update resupply event status
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResupplyEventStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResupplyEvent"

  /catalog/items:
    get:
      operationId: listCatalogItems
      tags: [catalog]
      summary: List the supply item catalog (chow, water, batteries, fuel, ammo, medical)
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Aggregate dashboard stats across all units
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/deficiencies:
    get:
      operationId: listDeficiencies
      tags: [dashboard]
      summary: All flagged supply deficiencies across units
      responses:
        "200":
          description: Deficiencies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deficiency"

  /dashboard/forecast:
    get:
      operationId: getResupplyForecast
      tags: [dashboard]
      summary: Projected resupply forecast (next 14 days) across units
      responses:
        "200":
          description: Forecast entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForecastEntry"

  /dashboard/activity:
    get:
      operationId: listRecentActivity
      tags: [dashboard]
      summary: Recent resupply / sync activity feed
      responses:
        "200":
          description: Activity feed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEntry"

  /sync/status:
    get:
      operationId: getSyncStatus
      tags: [sync]
      summary: Status of upstream logistics system sync
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
    post:
      operationId: triggerSync
      tags: [sync]
      summary: Trigger an immediate sync with upstream system
      responses:
        "200":
          description: Sync triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"

  /sync/settings:
    patch:
      operationId: updateSyncSettings
      tags: [sync]
      summary: Update auto-sync configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncSettingsInput"
      responses:
        "200":
          description: Updated sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"

  /sync/outbox:
    get:
      operationId: getSyncOutbox
      tags: [sync]
      summary: List pending and failed outbox records waiting to be pushed to SPIRE
      responses:
        "200":
          description: Pending and failed outbox items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncOutboxItem"

  /sync/outbox/{id}:
    delete:
      operationId: dismissOutboxRecord
      tags: [sync]
      summary: Permanently remove a failed outbox record (dismiss it from the queue)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dismissed
        "404":
          description: Record not found

  /sync/outbox/{id}/retry:
    post:
      operationId: retryOutboxRecord
      tags: [sync]
      summary: Reset a failed outbox record back to pending so it re-syncs immediately
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Record queued for retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncOutboxItem"
        "404":
          description: Record not found

  /sync/last-run:
    get:
      operationId: getSyncLastRun
      tags: [sync]
      summary: Details of the most recent SPIRE sync run
      responses:
        "200":
          description: Last sync run details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncLastRun"
        "204":
          description: No sync run has been performed yet

  /sync/runs:
    get:
      operationId: getSyncRuns
      tags: [sync]
      summary: Full history of past SPIRE sync runs, newest first
      responses:
        "200":
          description: List of sync run summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncRunSummary"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Echelon:
      type: string
      enum: [fireteam, squad, section, platoon, company, battalion]

    Climate:
      type: string
      enum: [temperate, arid, tropical, arctic]

    OpTempo:
      type: string
      enum: [garrison, sustained, high, combat]

    SupplyClass:
      type: string
      description: Marine Corps Class of Supply
      enum: ["I", "III", "V", "VIII", "IX"]

    Unit:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        callsign:
          type: string
          nullable: true
        echelon:
          $ref: "#/components/schemas/Echelon"
        personnel:
          type: integer
          minimum: 1
        commander:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        climate:
          $ref: "#/components/schemas/Climate"
        opTempo:
          $ref: "#/components/schemas/OpTempo"
        missionDays:
          type: integer
          minimum: 1
          description: Planned mission duration in days
        readiness:
          type: integer
          minimum: 0
          maximum: 100
          description: Computed readiness percentage (0-100)
        deficiencyCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - echelon
        - personnel
        - climate
        - opTempo
        - missionDays
        - readiness
        - deficiencyCount
        - createdAt
        - updatedAt

    UnitInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        callsign:
          type: string
          nullable: true
        echelon:
          $ref: "#/components/schemas/Echelon"
        personnel:
          type: integer
          minimum: 1
        commander:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        climate:
          $ref: "#/components/schemas/Climate"
        opTempo:
          $ref: "#/components/schemas/OpTempo"
        missionDays:
          type: integer
          minimum: 1
      required: [name, echelon, personnel, climate, opTempo, missionDays]

    CatalogItem:
      type: object
      properties:
        id:
          type: string
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        name:
          type: string
        nsn:
          type: string
          nullable: true
          description: National Stock Number
        unit:
          type: string
          description: Unit of issue (e.g. "MRE", "gal", "battery", "round", "L")
        baseDailyRate:
          type: number
          description: Base consumption per Marine per day at temperate / sustained tempo
        criticality:
          type: string
          enum: [low, medium, high, critical]
        notes:
          type: string
          nullable: true
      required:
        - id
        - supplyClass
        - name
        - unit
        - baseDailyRate
        - criticality

    SupplyEntry:
      type: object
      properties:
        id:
          type: string
        unitId:
          type: string
        itemId:
          type: string
        item:
          $ref: "#/components/schemas/CatalogItem"
        onHand:
          type: number
          minimum: 0
        dailyConsumption:
          type: number
          description: Adjusted daily consumption for this unit (climate / tempo / personnel)
        daysOfSupply:
          type: number
          description: Computed days of supply remaining
        required:
          type: number
          description: Required quantity for the unit's planned mission window
        shortfall:
          type: number
          description: Required minus on-hand (>= 0)
        status:
          type: string
          enum: [green, amber, red]
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - unitId
        - itemId
        - item
        - onHand
        - dailyConsumption
        - daysOfSupply
        - required
        - shortfall
        - status
        - updatedAt

    SupplyEntryInput:
      type: object
      properties:
        itemId:
          type: string
        onHand:
          type: number
          minimum: 0
      required: [itemId, onHand]

    CopyFromUnitInput:
      type: object
      properties:
        sourceUnitId:
          type: string
          description: The ID of the unit to copy supply items from
      required: [sourceUnitId]

    CopyFromUnitResult:
      type: object
      properties:
        added:
          type: integer
          minimum: 0
          description: Number of new items added from the source unit
        skipped:
          type: integer
          minimum: 0
          description: Number of items already tracked on this unit (not duplicated)
      required: [added, skipped]

    UnitDetail:
      type: object
      properties:
        unit:
          $ref: "#/components/schemas/Unit"
        supplyByClass:
          type: array
          items:
            $ref: "#/components/schemas/ClassSummary"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SupplyEntry"
        upcomingResupply:
          type: array
          items:
            $ref: "#/components/schemas/ResupplyEvent"
      required: [unit, supplyByClass, entries, upcomingResupply]

    ClassSummary:
      type: object
      properties:
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        label:
          type: string
        itemCount:
          type: integer
        worstDaysOfSupply:
          type: number
        status:
          type: string
          enum: [green, amber, red]
      required: [supplyClass, label, itemCount, worstDaysOfSupply, status]

    CalculationRequest:
      type: object
      properties:
        days:
          type: integer
          minimum: 1
        personnel:
          type: integer
          minimum: 1
          nullable: true
          description: Override personnel count for what-if calc
        climate:
          $ref: "#/components/schemas/Climate"
        opTempo:
          $ref: "#/components/schemas/OpTempo"
      required: [days, climate, opTempo]

    CalculationLine:
      type: object
      properties:
        item:
          $ref: "#/components/schemas/CatalogItem"
        dailyConsumption:
          type: number
        totalRequired:
          type: number
      required: [item, dailyConsumption, totalRequired]

    CalculationResult:
      type: object
      properties:
        days:
          type: integer
        personnel:
          type: integer
        climate:
          $ref: "#/components/schemas/Climate"
        opTempo:
          $ref: "#/components/schemas/OpTempo"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/CalculationLine"
      required: [days, personnel, climate, opTempo, lines]

    ResupplyEvent:
      type: object
      properties:
        id:
          type: string
        unitId:
          type: string
        unitName:
          type: string
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        itemId:
          type: string
          nullable: true
        itemName:
          type: string
          nullable: true
        quantity:
          type: number
        unit:
          type: string
        scheduledFor:
          type: string
          format: date-time
        status:
          type: string
          enum: [projected, planned, in_transit, delivered, cancelled]
        assignedTo:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - unitId
        - unitName
        - supplyClass
        - quantity
        - unit
        - scheduledFor
        - status
        - createdAt

    ResupplyEventInput:
      type: object
      properties:
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        itemId:
          type: string
          nullable: true
        quantity:
          type: number
          minimum: 0
        unit:
          type: string
        scheduledFor:
          type: string
          format: date-time
        assignedTo:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required: [supplyClass, quantity, unit, scheduledFor]

    ResupplyEventStatusInput:
      type: object
      properties:
        status:
          type: string
          enum: [projected, planned, in_transit, delivered, cancelled]
        assignedTo:
          type: string
          nullable: true
      required: [status]

    DashboardSummary:
      type: object
      properties:
        unitCount:
          type: integer
        personnelCount:
          type: integer
        readinessAvg:
          type: number
        deficiencyCount:
          type: integer
        criticalDeficiencyCount:
          type: integer
        upcomingResupplyCount:
          type: integer
        classBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ClassBreakdown"
      required:
        - unitCount
        - personnelCount
        - readinessAvg
        - deficiencyCount
        - criticalDeficiencyCount
        - upcomingResupplyCount
        - classBreakdown

    ClassBreakdown:
      type: object
      properties:
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        label:
          type: string
        green:
          type: integer
        amber:
          type: integer
        red:
          type: integer
      required: [supplyClass, label, green, amber, red]

    Deficiency:
      type: object
      properties:
        id:
          type: string
        unitId:
          type: string
        unitName:
          type: string
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        itemName:
          type: string
        daysOfSupply:
          type: number
        shortfall:
          type: number
        unit:
          type: string
        severity:
          type: string
          enum: [amber, red]
        flaggedAt:
          type: string
          format: date-time
      required:
        - id
        - unitId
        - unitName
        - supplyClass
        - itemName
        - daysOfSupply
        - shortfall
        - unit
        - severity
        - flaggedAt

    ForecastEntry:
      type: object
      properties:
        unitId:
          type: string
        unitName:
          type: string
        supplyClass:
          $ref: "#/components/schemas/SupplyClass"
        itemName:
          type: string
        projectedStockoutDate:
          type: string
          format: date-time
        daysUntilStockout:
          type: number
        recommendedQuantity:
          type: number
        unit:
          type: string
      required:
        - unitId
        - unitName
        - supplyClass
        - itemName
        - projectedStockoutDate
        - daysUntilStockout
        - recommendedQuantity
        - unit

    ActivityEntry:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [resupply_planned, resupply_delivered, deficiency_flagged, sync_completed, unit_created, supply_updated]
        message:
          type: string
        unitId:
          type: string
          nullable: true
        unitName:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
      required: [id, kind, message, timestamp]

    SyncStatus:
      type: object
      properties:
        connected:
          type: boolean
        upstreamSystem:
          type: string
        lastSyncAt:
          type: string
          format: date-time
          nullable: true
        pendingChanges:
          type: integer
        latencyMs:
          type: integer
          nullable: true
        autoSyncEnabled:
          type: boolean
        autoSyncIntervalMinutes:
          type: integer
      required: [connected, upstreamSystem, pendingChanges, autoSyncEnabled, autoSyncIntervalMinutes]

    SyncSettingsInput:
      type: object
      properties:
        autoSyncEnabled:
          type: boolean
        autoSyncIntervalMinutes:
          type: integer
          minimum: 1
          maximum: 60

    SyncOutboxItem:
      type: object
      properties:
        id:
          type: string
        entityKind:
          type: string
        entityId:
          type: string
        unitId:
          type: string
          nullable: true
        op:
          type: string
        createdAt:
          type: string
          format: date-time
        status:
          type: string
        lastError:
          type: string
          nullable: true
        itemName:
          type: string
          nullable: true
        unitName:
          type: string
          nullable: true
      required: [id, entityKind, entityId, op, createdAt, status]

    SyncPushResult:
      type: object
      properties:
        outboxId:
          type: string
        entityKind:
          type: string
        entityId:
          type: string
        success:
          type: boolean
        error:
          type: string
          nullable: true
        unitName:
          type: string
          nullable: true
        itemName:
          type: string
          nullable: true
      required: [outboxId, entityKind, entityId, success]

    SyncLastRun:
      type: object
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        pushedCount:
          type: integer
        failedCount:
          type: integer
        catalogMatched:
          type: integer
        catalogNew:
          type: integer
        catalogChanged:
          type: integer
        latencyMs:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/SyncPushResult"
