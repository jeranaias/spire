name: ✨ Feature request
description: Something missing or not yet useful. Use this for new capabilities, role-specific workflows, doctrine additions.
title: "[feature] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        We're actively listening to the pilot cohort. Concrete use-cases beat
        abstract requests every time. Tell us what you'd actually do with it.
  - type: dropdown
    id: role
    attributes:
      label: Whose workflow does this serve?
      options:
        - Maintenance Chief
        - G-4
        - MEF Commander
        - Data Custodian
        - Security Manager
        - All / Cross-cutting
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: |
        One paragraph: when does this come up? Garrison? Pre-deployment?
        Active incident? Coalition exercise?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today (without SPIRE)?
      description: Spreadsheet? Phone call? Different system?
    validations:
      required: true
  - type: textarea
    id: vision
    attributes:
      label: What would the ideal flow look like in SPIRE?
      description: |
        Describe the click path. "I'd open PULSE Forecast → click X →
        see Y → approve, and the system would do Z."
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority for your role
      options:
        - Quality-of-life — would be nice
        - Daily-driver — would use it weekly
        - Mission-critical — blocks something I do today
    validations:
      required: true
  - type: textarea
    id: gc
    attributes:
      label: Game-changer fit
      description: |
        Optional. If this is part of one of the 7 game-changers (autonomous
        replenishment, distributed consensus, predictive failure, C-UAS
        fusion, coalition mode, training flywheel, air-gap), call it out.
