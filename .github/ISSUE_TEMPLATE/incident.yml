name: 🚨 Operational incident
description: Use this for operational/security/integrity incidents — role-scoping leaks, classification banner failures, audit-chain anomalies, coalition release errors.
title: "[incident] "
labels: ["incident", "priority"]
body:
  - type: markdown
    attributes:
      value: |
        **For potential vulnerabilities — use the SECURITY.md path instead, not this template.**

        This template is for operational defects we can discuss publicly:
        the classification banner went stale, an alert leaked across role
        scope, the audit chain reported a verify failure, a coalition
        release shipped a record that should have been redacted.
  - type: input
    id: version
    attributes:
      label: SPIRE version
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Incident kind
      options:
        - Role-scoping leak (saw data outside my authorization)
        - Classification banner / FPCON spoofing or staleness
        - Audit chain anomaly (verify_chain returned a failure)
        - Coalition release shipped wrong / unredacted data
        - Air-gap mode escape (write succeeded while engaged)
        - Comms-state misreport (status footer disagreed with reality)
        - Other
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What did you observe?
      description: Concrete details. Time, view, role, what specifically you saw.
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: What should have happened?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Mission impact (if any)
      description: |
        Was this a demo issue or a "real" issue? In production, would this
        have caused a release error / leaked sensitive data / spoofed an
        FPCON change?
  - type: textarea
    id: artifacts
    attributes:
      label: Artifacts
      description: |
        Screenshot, audit-chain entry IDs, queue local_ids, anything that
        helps reproduce.
