name: 🛠 Bug
description: Something in SPIRE broke. Use this for incorrect behaviour, crashes, layout breaks.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. The pilot cohort uses these reports to steer development.
        If you can reach the app, the in-app **Report Issue** button (bottom-right)
        pre-fills most of this for you.
  - type: input
    id: version
    attributes:
      label: SPIRE version
      description: From the StatusFooter — e.g. `v1.0.0-rc1 · MDM 2026`.
      placeholder: v1.0.0-rc1
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Operator role at the time
      options:
        - Maintenance Chief
        - G-4
        - MEF Commander
        - Data Custodian
        - Security Manager
        - (n/a — pre-login)
    validations:
      required: true
  - type: dropdown
    id: view
    attributes:
      label: View where it happened
      options:
        - SENTRY · Upload
        - SENTRY · Processing
        - SENTRY · Review Queue
        - SENTRY · Mark Draft
        - SENTRY · Export
        - SENTRY · Coalition
        - PULSE · Fleet Overview
        - PULSE · Risk Board
        - PULSE · Cannibalization
        - PULSE · Forecast
        - BASTION · COP
        - BASTION · ThermalHawk Sim
        - StatusFooter / TopBar (chrome)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Even rough steps help — "I clicked X then Y."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or log
      description: Drag-and-drop a screenshot here, or paste relevant log lines.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Cosmetic — looks wrong but functional
        - Minor — workaround available
        - Major — blocks a workflow
        - Critical — blocks the demo / crashes the app
    validations:
      required: true
