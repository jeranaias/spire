name: Supply Chain

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * 1"  # weekly, Monday 07:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks scans every commit
      - name: Run gitleaks
        run: |
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner

  python-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Advisory until deps are exact-pinned (see PRODUCTION_CHECKLIST P2).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt --strict || true
          pip-audit -r dataset/requirements.txt --strict || true

  npm-audit:
    name: JS dependency audit (npm audit)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit
        run: npm audit --audit-level=high

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python SBOM
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          cyclonedx-py requirements backend/requirements.txt -o sbom-python-backend.json
          cyclonedx-py requirements dataset/requirements.txt -o sbom-python-dataset.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS SBOM
        run: |
          cd frontend && npm ci --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm --output-file ../sbom-js.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom-*.json
          if-no-files-found: warn
