name: CI

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Least privilege: the default token is read-only. Jobs that need more
# elevate explicitly (none here do).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend · pytest + dataset regen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r dataset/requirements.txt pytest pytest-asyncio
      - name: Dataset deterministic regen (seed 42, quick)
        run: |
          cd dataset
          python -c "from main import main as regen; regen(seed=42, quick=True)"
      - name: Run test suite
        # Full backend + integration + dataset suites. Playwright e2e run
        # separately (they need a browser + a live server).
        run: pytest tests/ backend/tests/ dataset/tests/ --ignore=tests/playwright -q

  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-fund
      - name: Type-check + build
        run: npm run build

  docker:
    name: Docker · build + image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t spire-backend:ci .
      - name: Build frontend image
        run: docker build -t spire-frontend:ci ./frontend
      - name: Trivy image scan (advisory)
        # Advisory until base images are hardened/pinned (see PRODUCTION_CHECKLIST).
        continue-on-error: true
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.1
          trivy image --severity HIGH,CRITICAL --ignore-unfixed spire-backend:ci
          trivy image --severity HIGH,CRITICAL --ignore-unfixed spire-frontend:ci
      - name: Smoke compose
        run: |
          docker compose up -d --build
          sleep 30
          curl -fsS http://localhost:8080/api/system/status | head -c 200
          docker compose down

  deploy:
    name: Fly.io · deploy spire-mdm
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    # Deliberate releases only: a `v*` tag push or a manual run — NOT every
    # commit to master. (Was deploy-on-every-push, which churned fly releases.)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: fly-deploy-spire-mdm
      cancel-in-progress: false
    environment:
      name: production
      url: https://spire-mdm.fly.dev
    steps:
      - uses: actions/checkout@v4
      # Pinned release (was @master — a moving branch is a supply-chain risk).
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --app spire-mdm --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" https://spire-mdm.fly.dev/api/system/status)
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
          done
          echo "::error::live URL did not return 200 after deploy"
          exit 1
