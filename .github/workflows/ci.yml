name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend · pytest + dataset regen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r dataset/requirements.txt pytest
      - name: Dataset deterministic regen (seed 42, quick)
        run: |
          cd dataset
          python -c "from main import main as regen; regen(seed=42, quick=True)"
      - name: Run pytest
        run: pytest dataset/tests/ -v

  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: Type-check + build
        run: npm run build

  playwright:
    name: Playwright · regression sweep
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r dataset/requirements.txt
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright runner
        run: npm ci --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      # Backend serves the built frontend/dist on the same origin in
      # prod and on Fly. Run that prod-shaped server on :5000 — the
      # default Playwright `baseURL` already points there. Quick-switch
      # is enabled so identity-pivoting specs work without a PIN re-entry.
      - name: Boot uvicorn (serves API + built frontend on :5000)
        env:
          SPIRE_DEMO_QUICK_SWITCH: "1"
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 5000 \
            > uvicorn.log 2>&1 &
          echo "uvicorn pid $!"
          # Wait for /api/system/status to come up. Up to ~60s — first
          # boot regenerates the canonical dataset.
          for i in $(seq 1 30); do
            sleep 2
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/system/status || true)
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
          done
          echo "::error::uvicorn did not become healthy in 60s"
          tail -200 uvicorn.log
          exit 1
      - name: Run Playwright suite
        env:
          SPIRE_E2E_FRONTEND_URL: "http://127.0.0.1:5000"
          SPIRE_E2E_BASE_URL: "http://127.0.0.1:5000"
        run: npx playwright test --reporter=list
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
            uvicorn.log
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [backend, frontend, playwright]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t spire-backend:ci .
      - name: Build frontend image
        run: docker build -t spire-frontend:ci ./frontend
      - name: Smoke compose
        run: |
          docker compose up -d --build
          sleep 30
          curl -fsS http://localhost:8080/api/system/status | head -c 200
          docker compose down

  deploy:
    name: Fly.io · deploy spire-mdm
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    concurrency:
      group: fly-deploy-spire-mdm
      cancel-in-progress: false
    environment:
      name: production
      url: https://spire-mdm.fly.dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only --ha=false --app spire-mdm --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Smoke
        run: |
          for i in 1 2 3 4 5; do
            sleep 5
            code=$(curl -s -o /dev/null -w "%{http_code}" https://spire-mdm.fly.dev/api/system/status)
            echo "  attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
          done
          echo "::error::live URL did not return 200 after deploy"
          exit 1
