name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 06:00 UTC

# Uploading to the Security tab needs code scanning enabled, which on a PRIVATE
# repo requires GitHub Advanced Security. This repo is private without GHAS, so
# we run the analysis and publish the SARIF as a build artifact instead — the
# SAST still runs, results are reviewable, and CI stays green. If the repo goes
# public or GHAS is enabled, set `upload: true` to post findings to the Security tab.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: warn
