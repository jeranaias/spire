[project]
name = "spire"
version = "0.1.0"
description = "SPIRE — offline contested-logistics operating system (SENTRY / PULSE / BASTION)"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "pydantic>=2.9.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
# Put the repo root (and dataset/) on sys.path so `import backend` / `import
# main` resolve under the bare `pytest` console script, not just `python -m
# pytest`. Without this, CI collection fails with ModuleNotFoundError.
pythonpath = [".", "dataset"]
# async tests (llm map, channel runner, dr scheduler) use pytest-asyncio.
asyncio_mode = "auto"
