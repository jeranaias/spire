# SPIRE — Fly.io deployment.
#
# One-time bootstrap (after `fly auth login`):
#   fly launch --no-deploy --copy-config --name spire-mdm --region iad
#   fly volume create spire_runtime --region iad --size 1 --yes
#   fly secrets set \
#       SPIRE_GITHUB_TOKEN=$(cat .env | grep ^SPIRE_GITHUB_TOKEN= | cut -d= -f2) \
#       SPIRE_GITHUB_REPO=jeranaias/spire \
#       SPIRE_DB_PASSPHRASE=$(openssl rand -base64 32)
#   fly deploy
#
# Subsequent deploys: just `fly deploy`.

app = "spire-mdm"
primary_region = "iad"

# Rolling deploy strategy. Bluegreen would be nicer (no 502 window
# while the old machine drains) but it requires a separate volume
# per machine — Fly volumes are single-attach and the bluegreen
# spin-up tripped "volume already claimed by machine …" against the
# still-running blue, blocking every push to master since the
# scenario pivot landed. To upgrade back to bluegreen, provision a
# second volume and attach it to the green machine. Until then:
# rolling. Operator-side mitigation: don't deploy in the last 30 min
# before stage.
[deploy]
  strategy = "rolling"

[build]
  dockerfile = "Dockerfile.web"

[env]
  SPIRE_MODE = "full"
  PYTHONUNBUFFERED = "1"
  # The online demo opts into the remote frontier model. Stock builds are
  # offline-first (SPIRE_LLM_PRIMARY_DISABLE defaults to 1 in code).
  SPIRE_LLM_PRIMARY_DISABLE = "0"

[http_service]
  internal_port = 8080
  force_https = true
  # Walkthrough audit (CRITICAL): prior config had
  # auto_stop_machines=stop + min_machines_running=0. Every cold
  # request sat behind a ~30s machine boot, and Fly's 60s upstream
  # cap surfaced as 504s in the operator's tab. FeedbackDrawer +
  # Forecast form submissions both timed out under that pressure
  # (form submit is a POST that doesn't auto-retry on the frontend).
  # Keep ONE machine warm so demo traffic always lands in <500ms.
  # Cost: ~$2/mo for a shared-1x-1gb idle machine vs. the demo
  # being broken under load.
  #
  # auto_stop=false (was "stop"): with "stop", the single machine still
  # idle-stopped despite min_machines_running=1, so the first request
  # after idle ate a ~9s cold wake (machine boot + dataset bootstrap of
  # 6k SRs / 128k snapshots) while warm requests are ~100ms. For a live
  # demo a 9s hang on first load is a showstopper; false pins the machine
  # on so the dataset stays resident in memory and every load is snappy.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    # Bumped timeout 5 → 10s; grace 30 → 60s. The dataset bootstraps
    # ~6,000 SRs + 350 assets at startup; the prior 30s grace
    # occasionally tripped the health check during a fresh boot,
    # which Fly read as a crashloop and restarted the machine —
    # cascading into the disconnect symptom the operator saw.
    timeout  = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "spire_runtime"
  destination = "/opt/spire/runtime"

[[vm]]
  cpu_kind = "shared"
  # Walkthrough audit: shared-cpu-1x caps at 2gb on Fly. Bumped to
  # shared-cpu-2x so 4gb is allowed. The 2nd CPU is also useful — the
  # ResponseForces auto-correlation + Monte Carlo path generation are
  # CPU-bound and benefited from the second core in local benchmarks.
  cpus = 2
  # Bumped 1gb → 4gb. The dataset + canonical state holds ~150MB at
  # rest, but cold-start spikes during boot (snapshot replay, scoring
  # warmup) hit ~700MB, and Monte Carlo forecast paths + the audit
  # chain verifier have transient peaks past 1.5gb under concurrent
  # load. 4gb gives the demo a hard ceiling well above the worst
  # observed working set; OOM-kills mid-demo are showstoppers and
  # not worth the cost saving.
  memory = "4gb"
