# SPIRE — nginx config for the combined Fly.io image.
# Serves the React SPA from /usr/share/nginx/html and reverse-proxies
# /api/* to the local uvicorn worker on 127.0.0.1:8700.

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reasonable defaults — defense in depth on a public deploy.
  client_max_body_size 16m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Health endpoint that nginx alone can answer (bypasses backend).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # API proxy — everything under /api goes to uvicorn.
  location /api/ {
    proxy_pass         http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Static assets — long cache, content-hashed names from Vite.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — any unmatched path returns index.html so HashRouter
  # behaves identically to local dev.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
