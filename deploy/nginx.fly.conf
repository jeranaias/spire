# SPIRE — nginx config for the combined Fly.io image.
# Serves the React SPA from /usr/share/nginx/html and reverse-proxies
# /api/* to the local uvicorn worker on 127.0.0.1:8700.

server {
  listen 8080 default_server;
  listen [::]:8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Real GCSS-MC exports run hundreds of MB. 16m was rejecting them
  # at the edge with 413 before they could reach the stage-ingest
  # endpoint. 1g matches the FastAPI/uvicorn default body cap.
  client_max_body_size 1024m;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content Security Policy — locks the SPA to same-origin assets plus the
  # MapLibre tile sources we actually use (Carto basemaps + OSM mirrors).
  # 'unsafe-inline' on style is needed for the <style> in index.html (static
  # hero) and the inline tokens MapLibre injects on layer creation. Tailwind
  # 4 emits a single hashed stylesheet so we'd otherwise add a hash here;
  # if a future pass tightens this, switch to style-src 'self' 'sha256-...'.
  # font-src includes data: because @fontsource ships a few inlined preview
  # fallbacks; everything else is served same-origin from /assets/.
  #
  # NOTE on Carto host pattern — the style.json lives at the bare apex
  # (https://basemaps.cartocdn.com/...) while the tiles come off subdomains
  # (https://a/b/c.basemaps.cartocdn.com/...). CSP wildcards are subdomain-
  # only so we list both the apex AND the wildcard. Without the apex entry
  # the style fetch is blocked even though tiles load.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://*.openstreetmap.org; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://api.mapbox.com https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com https://*.openstreetmap.org; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Health endpoint that nginx alone can answer (bypasses backend).
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # API proxy — everything under /api goes to uvicorn.
  location /api/ {
    proxy_pass         http://127.0.0.1:8700;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    # 180s instead of 60s — when 20+ concurrent BASTION requests hit on
    # page load, the single uvicorn worker serializes them and the
    # tail of the queue can sit longer than 60s. nginx 504 vs the
    # backend would have answered. Raised to make the worst case still
    # complete instead of show a stack of red errors in console.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }

  # Static assets — long cache, content-hashed names from Vite. Asset names
  # change on every build so the immutable cache is safe.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must NEVER cache. The hashed asset filenames it references
  # change on every deploy, and a stale index.html points returning users
  # at a 503'd chunk path. Reviewer caught this — `PulseView-DEXDfOCu.js`
  # 503'd because the chunk had been replaced by a fresh hash.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    expires off;
    try_files $uri =404;
  }

  # SPA fallback — any unmatched path returns index.html so HashRouter
  # behaves identically to local dev. Same no-cache headers apply because
  # this serves /index.html under the hood.
  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    expires off;
    try_files $uri $uri/ /index.html;
  }
}
