# nginx config for the marlog-web container.
#
# Serves the Vite SPA from /usr/share/nginx/html and proxies /api to the
# marlog-api service.  The upstream host name (`marlog-api`) is resolved by
# Docker's embedded DNS when the two services share a network — this works
# unchanged in docker-compose and in any orchestrator that exposes service
# names via DNS.
#
# History API fallback (`try_files ... /index.html`) is required for the
# wouter-based SPA so deep links like /units/123 resolve client-side.

upstream marlog_api {
    server marlog-api:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy
    location /api/ {
        proxy_pass         http://marlog_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static assets — long cache, immutable hashes from Vite
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check for orchestrators
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
