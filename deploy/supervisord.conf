; SPIRE — supervisord program list for the combined image.
; Runs tailscale (if TS_AUTHKEY set), nginx, and uvicorn under one PID 1.
; If any dies, supervisord restarts it; if it crashloops, the container
; exits and the orchestrator (Fly) restarts the whole VM.

[program:tailscale]
command=/usr/local/bin/tailscale-up.sh
autostart=true
autorestart=unexpected
exitcodes=0
priority=5
startsecs=2
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:uvicorn]
command=/usr/local/bin/python -m uvicorn backend.main:app --host 127.0.0.1 --port 8700 --proxy-headers --forwarded-allow-ips=*
directory=/opt/spire
; tailscaled (in userspace mode) listens at 127.0.0.1:1099 as an HTTP proxy.
; HTTPS_PROXY routes httpx LLM calls through the tailnet so DNS resolution
; for *.ts.net hosts returns the 100.x peer IPs instead of public Funnel IPs.
; NO_PROXY exempts the GitHub API (feedback drawer) and loopback so those
; calls take the regular Fly egress path.
environment=HTTP_PROXY="http://127.0.0.1:1099",HTTPS_PROXY="http://127.0.0.1:1099",NO_PROXY="127.0.0.1,localhost,api.github.com,.github.com"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
